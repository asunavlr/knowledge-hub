[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub"
version = "0.1.0"
description = "A document Q&A API powered by retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0", "pydantic-settings>=2.5,<3.0",
  "openai>=1.50,<3.0", "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.12,<1.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
